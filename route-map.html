<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route Map">
<meta name="theme-color" content="#14181d">
<title>Route Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#14181d; --panel:#1d232b; --panel2:#262e38; --text:#eef1f4; --muted:#9aa6b2;
    --accent:#3b9cff; --danger:#ff5a5a; --ok:#3ccf7a; --border:#33404d;
    --curb:#3b9cff; --cbu:#f5a623; --door:#3ccf7a; --po:#b57bff; --other:#9aa6b2; --house:#f2f2f2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0;z-index:1}
  header{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;gap:6px;align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:rgba(20,24,29,.92);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  #q{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);padding:0 12px;font-size:16px}
  .hbtn{width:40px;height:42px;flex:none;border-radius:10px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);font-size:19px;display:flex;align-items:center;justify-content:center;padding:0}
  .hbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hcount{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--cbu);color:#111;
    font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
  .pkflag{position:absolute;top:-11px;right:-9px;font-size:14px;line-height:1;filter:drop-shadow(0 1px 1px #000)}
  .pin,.hpin{position:relative}
  .pin.pk,.hpin.pk{box-shadow:0 0 0 3px #f5a623,0 1px 4px rgba(0,0,0,.5)}
  .nv-pk{margin-top:8px;padding:9px 10px;border-radius:9px;background:#f5a623;color:#111;font-weight:800;font-size:16px}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;max-height:60vh;overflow:auto;
    background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;
    padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -6px 24px rgba(0,0,0,.4);
    transition:transform .2s;-webkit-overflow-scrolling:touch}
  #sheet.hidden{transform:translateY(110%)}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 8px}
  .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .shead h3{margin:0;font-size:17px}
  .x{background:none;border:none;color:var(--muted);font-size:24px;padding:4px 8px}
  .ghead{position:sticky;top:-10px;background:var(--panel);font-size:12px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);padding:10px 4px 4px;border-bottom:1px solid var(--border);z-index:2}
  .item{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--border)}
  .item.last{background:rgba(59,156,255,.16);box-shadow:inset 3px 0 0 var(--accent)}
  .badge{min-width:38px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#111;padding:0 6px;flex:none}
  .itxt{flex:1;min-width:0}
  .itxt .a{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .itxt .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tags{display:flex;flex-direction:column;gap:2px;align-items:flex-end;flex:none;font-size:11px}
  .tag{padding:1px 6px;border-radius:6px;background:var(--panel2);color:var(--muted)}
  .tag.ok{color:var(--ok)}
  .tag.closed{color:var(--danger)}
  .daypick{display:flex;gap:4px;flex-wrap:wrap}
  .daypick label{margin:0;flex:1;min-width:38px;text-align:center;padding:9px 0;border-radius:8px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600}
  .daypick input{display:none}
  .daypick label.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=time]{width:100%;border-radius:9px;border:1px solid var(--border);background:var(--panel);
    color:var(--text);padding:9px;font-size:16px;font-family:inherit;min-height:42px}
  .bizline{margin:4px 0 2px;font-size:14px}
  .warn{color:var(--cbu);font-size:13px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
  input[type=text],select,textarea{width:100%;border-radius:9px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);padding:10px;font-size:16px;font-family:inherit}
  textarea{min-height:60px;resize:vertical}
  .two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
  .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row button{flex:1;min-width:28%}
  button.b{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
    font-size:15px;font-weight:600;padding:0 10px}
  button.sm{min-height:38px;font-size:14px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
  .locbox{margin-top:12px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--border)}
  .locbox .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .locbox .c{font-size:13px;color:var(--muted);margin-top:3px}
  .locbox .row{margin-top:8px}
  .locbox button.b{background:var(--panel)}
  .locbox input[type=text],.locbox select{background:var(--panel)}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid #fff;flex:none}
  .sq{width:14px;height:14px;border-radius:3px;display:inline-block;background:var(--house);border:2px solid #333;flex:none}
  .hint{color:var(--muted);font-size:13px;margin:6px 0 0}
  .detail .a{font-size:19px;font-weight:700;margin:2px 0 2px}
  .detail .n{font-size:15px;margin-bottom:6px}
  .detail .notes{white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:9px;margin-top:8px}
  .chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;color:var(--text)}
  .chk input{width:22px;height:22px}
  #banner{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 66px);z-index:1001;
    background:var(--accent);color:#fff;border-radius:10px;padding:10px 12px;display:none;
    align-items:center;justify-content:space-between;font-weight:600}
  #banner button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-weight:600}
  #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 24px);
    z-index:2000;background:#000d;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;
    max-width:90vw;text-align:center;display:none}
  .pinwrap{width:120px;height:30px;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .pin,.hpin{pointer-events:auto}
  .pin{display:flex;align-items:center;justify-content:center;border-radius:15px;border:2px solid #fff;
    font:700 11px/1 -apple-system,system-ui,sans-serif;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.5);min-width:30px;height:30px;padding:0 5px;white-space:nowrap}
  .hpin{display:flex;align-items:center;justify-content:center;border-radius:5px;border:2px solid #222;background:var(--house);
    font:700 11px/1 -apple-system,system-ui,sans-serif;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.5);min-width:28px;height:28px;padding:0 5px;white-space:nowrap}
  .hpin .hs{color:#666;font-weight:600;margin-right:3px}
  .sel{outline:3px solid #ffd60a;outline-offset:2px}
  .pin.done,.hpin.done{opacity:.35;filter:grayscale(1)}
  .hpin.approx{border-style:dashed;border-color:#f5a623;background:#fff6e0}
  .item.done .itxt,.item.done .badge{opacity:.45;filter:grayscale(1)}
  .item.done .itxt .a::after{content:' ✓';color:var(--ok)}
  /* vehicle check */
  .ck{padding:10px 0;border-bottom:1px solid var(--border)}
  .ck .nm{font-weight:600;margin-bottom:6px}
  .ck .st{display:flex;gap:6px}
  .ck .st button{flex:1;min-height:40px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:700;font-size:14px}
  .ck .st button.on-ok{background:#1e5a36;border-color:var(--ok);color:#fff}
  .ck .st button.on-prob{background:#6a2222;border-color:var(--danger);color:#fff}
  .ck .st button.on-na{background:#3a4450;border-color:var(--muted);color:#fff}
  .ck .pb{margin-top:8px}
  .nv-btns button.pkg-on{background:#7a4a00;border-color:var(--cbu);color:#fff}
  .t-curb{background:var(--curb)} .t-cbu{background:var(--cbu)} .t-door{background:var(--door)}
  .t-po{background:var(--po)} .t-other{background:var(--other)}
  .leaflet-control-layers{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important}
  .leaflet-top{top:calc(env(safe-area-inset-top) + 62px)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .stat{color:var(--muted);font-size:14px}

  /* space number labels (RV spaces etc.) */
  .spl{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 -apple-system,system-ui,sans-serif;color:#111;
    background:rgba(255,255,255,.88);border:1px solid #555;border-radius:4px;padding:2px 4px;white-space:nowrap}
  .lowz:not(.labeling) .spl{display:none}
  .labeling .spl{background:#ffd60a;border-color:#111}
  #labelbar{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 66px);z-index:1001;display:none;
    background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #labelbar .lr{display:flex;gap:6px}
  #labelbar input{flex:1;min-width:0}
  #labelbar button{min-height:42px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:600;padding:0 12px}
  #labelbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}

  /* photos */
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .thw{position:relative}
  .thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--panel);display:block;border:1px solid var(--border)}
  .thx{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-weight:700;font-size:12px}
  #viewer{position:fixed;inset:0;z-index:3000;background:#000;display:none;flex-direction:column}
  #viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
  .vw-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px)}
  .vw-bar button{min-width:56px;min-height:44px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:18px}
  .vw-bar span{color:#ccc}

  /* route guidance panel */
  #navbar{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:999;display:none;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
  .nv-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
  .nv-main{display:flex;align-items:center;gap:10px}
  .nv-arrow{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--panel2)}
  .nv-arrow svg{transition:transform .4s}
  .nv-txt{flex:1;min-width:0}
  .nv-addr{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nv-dist{font-size:20px;font-weight:800;flex:none;text-align:right}
  .nv-turn{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--panel2);font-weight:600;font-size:15px}
  .nv-paused{margin-top:8px;padding:8px 10px;border-radius:9px;background:#5a4300;color:#ffd60a;font-weight:700;text-align:center}
  .nv-btns{display:flex;gap:6px;margin-top:8px}
  .nv-btns button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:17px;font-weight:700;padding:0}
  .nv-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .nv-btns button.off{opacity:.45}

  /* times */
  table.tt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  table.tt th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:4px 4px;border-bottom:1px solid var(--border)}
  table.tt td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}
  table.tt td.r,table.tt th.r{text-align:right;white-space:nowrap}
  .faster{color:var(--ok)} .slower{color:var(--danger)}
  .big{font-size:26px;font-weight:800}
</style>
</head>
<body>
<div id="map"></div>

<header>
  <input id="q" type="search" placeholder="Search address, name, unit, seq #" autocomplete="off" autocorrect="off">
  <button class="hbtn" id="btnPkg" title="Today's packages" style="position:relative">📦<span id="pkgCount" class="hcount"></span></button>
  <button class="hbtn" id="btnList" title="List">☰</button>
  <button class="hbtn" id="btnAdd" title="Add stop">＋</button>
  <button class="hbtn" id="btnLocate" title="My location">◎</button>
  <button class="hbtn" id="btnData" title="Data &amp; settings">⋯</button>
</header>

<div id="banner"><span id="bannerText">Tap the map to place the pin</span><button id="bannerCancel">Cancel</button></div>
<div id="labelbar">
  <div class="lr">
    <input id="lb-text" type="text" value="RV1" autocapitalize="characters" autocorrect="off" aria-label="Next label">
    <button data-lb="undo">Undo</button>
    <button class="primary" data-lb="done">Done</button>
  </div>
  <p class="hint">Tap the map to drop this label. The number goes up by one each time. Tap a yellow label to rename or delete it; drag to move it.</p>
</div>
<div id="navbar"></div>
<div id="sheet" class="hidden"></div>
<div id="toast"></div>
<div id="viewer"><img id="vw-img" alt="Stop photo"><div class="vw-bar"><button data-vw="prev">◀</button><span id="vw-n"></span><button data-vw="next">▶</button><button data-vw="close">✕</button></div></div>
<input type="file" id="fileIn" accept=".json,.csv,text/csv,application/json" style="display:none">
<input type="file" id="photoIn" accept="image/*" multiple style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';

/* ================= constants & state ================= */
const KEY = 'routeMap.stops.v2';
const OLD_KEY = 'routeMap.stops.v1';
const SKEY = 'routeMap.settings.v1';
const SPKEY = 'routeMap.spaces.v1';
const RKEY = 'routeMap.runs.v1';
const TYPES = {
  curb:  'Curbside box',
  cbu:   'Cluster box (CBU)',
  door:  'Door / porch slot',
  po:    'Parcel locker',
  other: 'Other'
};
const WHAT = { box: 'Mailbox', house: 'House / package drop' };

let stops = [];
let spaces = [];
let runs = [];
let settings = { area: 'Fort Bragg, CA', showLine: false, labels: 'mixed', lastId: null,
  navTo: 'auto', arriveFt: 80, navVoice: true, navNames: false, navTurns: false, navPos: null };
let editing = null;          // working copy while the form is open
let selectedId = null;
let tapTarget = null;        // 'box' | 'house' while waiting for a map tap
let labelMode = false;       // dropping space labels
let sheetMode = null;        // 'list' | 'detail' | 'form' | 'data' | 'times'
let watchId = null, userDot = null, userAcc = null, firstFix = false;

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const okPt = p => !!p && typeof p.lat === 'number' && typeof p.lng === 'number' && isFinite(p.lat) && isFinite(p.lng);
const mkPt = (lat, lng) => { lat = parseFloat(lat); lng = parseFloat(lng); return isFinite(lat) && isFinite(lng) ? { lat, lng } : null; };
function seqNum(s){ const n = parseFloat(s.seq); return isNaN(n) ? Infinity : n; }
function seqLabel(s){ return s.seq !== '' && s.seq != null ? String(s.seq) : '–'; }
function sorted(arr){
  return arr.slice().sort((a,b) => seqNum(a) - seqNum(b) || String(a.address).localeCompare(String(b.address), undefined, {numeric:true}));
}
function fullAddr(s){ return (s.address || '') + (s.unit ? ' ' + (/^\(/.test(s.unit) ? s.unit : '#' + s.unit) : ''); }
function anyPt(s){ return okPt(s.box) ? s.box : (okPt(s.house) ? s.house : null); }
let toastT;
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms || 2600);
}
function normType(v){
  v = String(v || '').toLowerCase().trim();
  if (TYPES[v]) return v;
  if (/cbu|cluster|nbu/.test(v)) return 'cbu';
  if (/curb|road|rural/.test(v)) return 'curb';
  if (/door|porch|slot|wall/.test(v)) return 'door';
  if (/locker|parcel/.test(v)) return 'po';
  return v ? 'other' : 'curb';
}
function cleanStop(s){
  return {
    id: s.id ? String(s.id) : uid(),
    seq: s.seq == null ? '' : String(s.seq).trim(),
    group: String(s.group || '').trim(),
    address: String(s.address || '').trim(),
    unit: String(s.unit || '').trim(),
    name: String(s.name || '').trim(),
    type: normType(s.type),
    notes: String(s.notes || '').trim(),
    box: okPt(s.box) ? { lat: s.box.lat, lng: s.box.lng } : mkPt(s.box_lat != null ? s.box_lat : s.lat, s.box_lng != null ? s.box_lng : s.lng),
    house: okPt(s.house) ? { lat: s.house.lat, lng: s.house.lng } : mkPt(s.house_lat, s.house_lng),
    biz: cleanBiz(s.biz || { name: s.biz_name, days: s.biz_days, open: s.biz_open, close: s.biz_close, note: s.biz_note }),
    photos: Array.isArray(s.photos) ? s.photos.map(String) : [],
    houseApprox: !!s.houseApprox && !!(s.house || s.house_lat),
    pkgManual: Math.max(0, parseInt(s.pkgManual, 10) || 0)
  };
}

/* ================= today's packages (from packing-slip addresses) ================= */
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayPkgs(){
  const t = settings.pkgToday;
  return t && t.date === todayStr() && Array.isArray(t.ids) ? t.ids : [];
}
function setTodayPkgs(ids){ settings.pkgToday = { date: todayStr(), ids: [...new Set(ids)] }; saveSettings(); }
function hasPkgToday(id){ return todayPkgs().includes(id); }
const ROADW = { hwy:'highway', rd:'road', ln:'lane', dr:'drive', ct:'court', st:'street', ave:'avenue', wy:'way', n:'north', s:'south', e:'east', w:'west', blvd:'boulevard', pl:'place' };
const SKIPW = new Set(['fort','bragg','ca','california','usa','us','apt','unit','space','the']);
function normWords(str){
  return String(str).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean).map(w => ROADW[w] || w).filter(w => !SKIPW.has(w) && !/^\d+$/.test(w));
}
/* Find route stops matching one line of a packing-slip address. */
function matchAddress(line){
  if (/\b[A-Z]{2}\s+\d{5}(-\d{4})?\b/i.test(line) && !/^\s*\d{3,6}\s+[A-Za-z]/.test(line)) return null;   // city/state/ZIP line
  const m = line.match(/\b(\d{3,6})(?:\s*1\/2)?\s+([A-Za-z].*)$/);
  if (!m) return null;
  const num = m[1], words = normWords(m[2]);
  let cands = stops.filter(s => (String(s.address).match(/^\s*(\d+)/) || [])[1] === num);
  if (cands.length > 1 && words.length) {
    const sc = cands.map(s => { const have = new Set(normWords(s.address + ' ' + s.group)); return { s, n: words.filter(w => have.has(w)).length }; });
    const best = Math.max(...sc.map(x => x.n));
    if (best > 0) cands = sc.filter(x => x.n === best).map(x => x.s);
  }
  const um = line.match(/\b(?:apt|unit|space|sp|#)\s*([A-Za-z]*\d+[A-Za-z]?)\b/i) || line.match(/\b(RV\d+|MS\d+[A-Z]?|C\d+|P\d+)\b/i);
  if (um && cands.length > 1) { const u = um[1].toLowerCase(); const hit = cands.filter(s => s.unit.toLowerCase().replace(/[()#\s]/g, '') === u); if (hit.length) cands = hit; }
  return { line: line.trim(), num, cands: sorted(cands) };
}

/* Counts packages per stop: every 📦 logged during route guidance + any you add by hand on a stop's page.
   The busiest stop on the route is 10; everything else is scaled against it. */
function pkgCounts(){
  const c = new Map();
  runs.forEach(r => (r.drops || []).forEach(d => (d.pkg || []).forEach(p => { const id = p.id || d.ids[0]; c.set(id, (c.get(id) || 0) + 1); })));
  stops.forEach(s => { if (s.pkgManual) c.set(s.id, (c.get(s.id) || 0) + s.pkgManual); });

}
function pkgRatings(){

/* ================= distance & direction ================= */
const toR = x => x * Math.PI / 180;
function distM(a, b){
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat/2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng/2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
function bearing(a, b){
  const y = Math.sin(toR(b.lng - a.lng)) * Math.cos(toR(b.lat));
  const x = Math.cos(toR(a.lat)) * Math.sin(toR(b.lat)) - Math.sin(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.cos(toR(b.lng - a.lng));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
/* shortest distance (m) from point p to a polyline */
function distToPath(p, pts){
  let best = Infinity;
  const kx = Math.cos(toR(p.lat)) * 111320, ky = 110540;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = (pts[i].lng - p.lng) * kx, ay = (pts[i].lat - p.lat) * ky;
    const bx = (pts[i+1].lng - p.lng) * kx, by = (pts[i+1].lat - p.lat) * ky;
    const dx = bx - ax, dy = by - ay, L2 = dx*dx + dy*dy;
    let t = L2 ? -(ax*dx + ay*dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    best = Math.min(best, Math.hypot(ax + t*dx, ay + t*dy));
  }
  return best;
}
function fmtDist(m){ const ft = m * 3.28084; return ft < 1000 ? Math.max(50, Math.round(ft / 50) * 50) + ' feet' : (m / 1609.34).toFixed(1) + ' miles'; }
function fmtDistShort(m){ const ft = m * 3.28084; return ft < 1000 ? Math.max(10, Math.round(ft / 10) * 10) + ' ft' : (m / 1609.34).toFixed(1) + ' mi'; }
const COMPASS = ['N','NE','E','SE','S','SW','W','NW'];
function compass(b){ return COMPASS[Math.round(b / 45) % 8]; }

/* ================= business hours ================= */
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseDays(v){
  if (Array.isArray(v)) return v.map(Number).filter(n => n >= 0 && n <= 6);
  const out = new Set();
  String(v || '').split(/[,\s]+/).filter(Boolean).forEach(tok => {
    const r = tok.split('-').map(t => DAYS.findIndex(d => d.toLowerCase() === t.slice(0,3).toLowerCase()));
    if (r.length === 2 && r[0] >= 0 && r[1] >= 0) { for (let i = r[0]; ; i = (i + 1) % 7) { out.add(i); if (i === r[1]) break; } }
    else if (r[0] >= 0) out.add(r[0]);
  });
  return [...out].sort();
}
function cleanTime(t){ const m = String(t || '').trim().match(/^(\d{1,2}):?(\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? String(m[1]).padStart(2,'0') + ':' + m[2] : ''; }
function cleanBiz(b){
  if (!b) return null;
  const biz = { name: String(b.name || '').trim(), days: parseDays(b.days), open: cleanTime(b.open), close: cleanTime(b.close), note: String(b.note || '').trim() };
  return biz.name || biz.days.length || biz.open || biz.close || biz.note ? biz : null;
}
function fmtTime(t){ if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2,'0') : '') + ap; }
function daysText(days){
  if (!days.length) return '';
  if (days.length === 7) return 'Every day';
  const runsTxt = []; let start = days[0], prev = days[0];
  for (let i = 1; i <= days.length; i++) {
    if (days[i] === prev + 1) { prev = days[i]; continue; }
    runsTxt.push(start === prev ? DAYS[start] : DAYS[start] + (prev - start > 1 ? '–' : ', ') + DAYS[prev]);
    start = prev = days[i];
  }
  return runsTxt.join(', ');
}
function hoursText(b){
  if (!b) return '';
  const parts = [];
  if (b.days.length) parts.push(daysText(b.days));
  if (b.open && b.close) parts.push(fmtTime(b.open) + '–' + fmtTime(b.close));
  return parts.join(' ');
}
/* true = open now, false = closed now, null = hours not set */
function openNow(b, d){
  if (!b || !b.days.length || !b.open || !b.close) return null;
  d = d || new Date();
  const mins = d.getHours() * 60 + d.getMinutes();
  const toM = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const o = toM(b.open), c = toM(b.close), day = d.getDay();
  if (o < c) return b.days.includes(day) && mins >= o && mins < c;
  return (b.days.includes(day) && mins >= o) || (b.days.includes((day + 6) % 7) && mins < c);
}
function openBadge(b){
  const st = openNow(b);
  return st === null ? '' : st ? '<span class="tag ok">Open now</span>' : '<span class="tag closed">Closed now</span>';
}

/* ================= photo storage (IndexedDB — kept separate so photos don't fill the stop list's space) ================= */
let photoDB = null;
function pdb(){
  if (photoDB) return Promise.resolve(photoDB);
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open('routeMapPhotos', 1); } catch(e){ return rej(e); }
    r.onupgradeneeded = () => { const st = r.result.createObjectStore('photos', { keyPath: 'id' }); st.createIndex('stopId', 'stopId'); };
    r.onsuccess = () => { photoDB = r.result; res(photoDB); };
    r.onerror = () => rej(r.error);
  });
}
/* fn must issue its requests synchronously; resolves when the transaction completes */
async function pOp(mode, fn){
  const db = await pdb();
  return new Promise((res, rej) => {
    const tx = db.transaction('photos', mode);
    const r = fn(tx.objectStore('photos'));
    tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
    tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const photoPut = rec => pOp('readwrite', st => st.put(rec));
const photoGet = id => pOp('readonly', st => st.get(id));
const photoAll = () => pOp('readonly', st => st.getAll());
const photoClear = () => pOp('readwrite', st => st.clear());
function photoDel(id){ revokePhoto(id); return pOp('readwrite', st => st.delete(id)); }
function photoDelFor(stopId){
  return pOp('readwrite', st => {
    const r = st.index('stopId').openCursor(IDBKeyRange.only(stopId));
    r.onsuccess = () => { const c = r.result; if (c) { revokePhoto(c.value.id); c.delete(); c.continue(); } };
  });
}
const photoURLs = new Map();
function revokePhoto(id){ const u = photoURLs.get(id); if (u) { URL.revokeObjectURL(u); photoURLs.delete(id); } }
async function photoURL(id){
  if (photoURLs.has(id)) return photoURLs.get(id);
  const rec = await photoGet(id);
  if (!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob); photoURLs.set(id, u); return u;
}
function fillThumbs(){

  });
}
async function resizeImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read that photo')); i.src = url; });
    const max = 1600;
    let w = img.naturalWidth, h = img.naturalHeight;
    const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.72));
    if (!blob) throw new Error('Could not compress that photo');
    return { blob, w, h };
  } finally { URL.revokeObjectURL(url); }
}
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); }); }

    const sp = spaces.find(x => x.id === id);
    spaces = spaces.filter(x => x.id !== id); saveSpaces(); renderSpaces();
    if (sp) $('lb-text').value = sp.text;
  }
});

/* ================= sheet ================= */
function openSheet(mode, html, keepScroll){

  sh.classList.remove('hidden');

}
function closeSheet(){
  $('sheet').classList.add('hidden');
  sheetMode = null;
  if (selectedId) { selectedId = null; renderMarkers(); }
}

/* ----- list ----- */
function matches(s, q){
  if (!q) return true;
  const hay = [seqLabel(s), s.group, s.address, s.unit, s.name, s.notes, TYPES[normType(s.type)],
    s.biz ? 'business ' + s.biz.name + ' ' + s.biz.note : ''].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
let listCap = 300;
function showList(keepScroll){
  const q = $('q').value.trim();
  const all = sorted(stops.filter(s => matches(s, q)));
  const lastIdx = settings.lastId ? all.findIndex(s => s.id === settings.lastId) : -1;
  if (lastIdx >= listCap) listCap = Math.ceil((lastIdx + 50) / 300) * 300;
  const list = all.slice(0, listCap);
  const nb = stops.filter(s => okPt(s.box)).length, nh = stops.filter(s => okPt(s.house)).length;
  let html = `<div class="shead"><h3>${q ? all.length + ' match' + (all.length === 1 ? '' : 'es') : stops.length + ' stops'}</h3><button class="x" data-act="close">×</button></div>`;
  if (!q && stops.length) html += `<div class="stat" style="margin-bottom:4px">${nb} mailboxes placed · ${nh} houses placed</div>`;
  if (!stops.length) html += `<p class="stat">No stops yet. Tap <b>＋</b> to add one, or import your route CSV from the ⋯ menu.</p>`;
  let lastGroup = null;
  const done = doneIds();
  const rate = pkgRatings();
  list.forEach(s => {
    const pr = rate.get(s.id);
    if (s.group !== lastGroup) { html += `<div class="ghead">${esc(s.group || 'No section')}</div>`; lastGroup = s.group; }
    html += `
    <div class="item${s.id === settings.lastId ? ' last' : ''}${done.has(s.id) ? ' done' : ''}" data-id="${esc(s.id)}">
      <div class="badge t-${normType(s.type)}">${esc(seqLabel(s))}</div>
      <div class="itxt"><div class="a">${hasPkgToday(s.id) ? '📦 ' : ''}${esc(fullAddr(s)) || '<i>No address</i>'}</div>
        <div class="s">${s.photos.length ? '📷 ' : ''}${s.biz && s.biz.name ? '🏪 ' + esc(s.biz.name) + (s.name ? ' · ' + esc(s.name) : '') : (s.name ? esc(s.name) : '<i>no name</i>')}${s.notes ? ' · ' + esc(s.notes) : ''}</div></div>
      <div class="tags">${pr ? `<span class="tag" style="color:var(--cbu)">📦 ${pr.score}/10</span>` : ''}${openBadge(s.biz)}<span class="tag${okPt(s.box) ? ' ok' : ''}">${okPt(s.box) ? '✓' : '–'} box</span><span class="tag${okPt(s.house) ? ' ok' : ''}">${okPt(s.house) ? '✓' : '–'} house</span></div>
    </div>`;
  });
  if (all.length > list.length) html += `<div class="row"><button class="b" data-act="more">Show ${Math.min(300, all.length - list.length)} more (${all.length - list.length} left)</button></div>`;
  openSheet('list', html, keepScroll);
  if (!keepScroll && lastIdx >= 0) {
    const sh = $('sheet'), el = sh.querySelector('.item.last');
    if (el) sh.scrollTop = Math.max(0, el.offsetTop - sh.clientHeight / 2 + el.offsetHeight / 2);
  }
}

function neighbor(id, dir){

    editing = { id: null, newId: uid(), seq: String(after && isFinite(seqNum(after)) ? Math.floor(seqNum(after)) + 1 : Math.floor(maxSeq) + 1),

function readForm(){
  if (!editing || !$('f-seq')) return;
  editing.seq = $('f-seq').value.trim();
  editing.unit = $('f-unit').value.trim();
  editing.address = $('f-addr').value.trim();
  editing.name = $('f-name').value.trim();
  editing.group = $('f-group').value.trim();
  editing.type = $('f-type').value;
  editing.notes = $('f-notes').value.trim();
  if ($('f-isbiz').checked) {
    editing.biz = {
      name: $('f-bname').value.trim(),
      days: [...document.querySelectorAll('.daypick input[data-day]')].filter(x => x.checked).map(x => +x.dataset.day),
      open: $('f-open').value, close: $('f-close').value, note: $('f-bnote').value.trim()
    };
  } else editing.biz = null;
}
function setEditLoc(what, lat, lng){
  readForm();
  editing[what] = { lat, lng };
  updateTemps();
  showForm();
}
function updateTemps(){
  ['box','house'].forEach(w => { if (temp[w]) { map.removeLayer(temp[w]); temp[w] = null; } });
  if (!editing) return;
  ['box','house'].forEach(w => {
    if (!okPt(editing[w])) return;
    const m = L.marker([editing[w].lat, editing[w].lng], { draggable: true, zIndexOffset: 1000,
      icon: w === 'box' ? boxIcon(editing, true) : houseIcon(editing, true) }).addTo(map);
    m.on('dragend', () => {
      const p = m.getLatLng();
      editing[w] = { lat: p.lat, lng: p.lng };
      const el = $('loc-' + w); if (el) el.textContent = p.lat.toFixed(6) + ', ' + p.lng.toFixed(6) + ' — drag pin to adjust';
    });
    temp[w] = m;
  });
}
function endForm(){
  editing = null;
  ['box','house'].forEach(w => { if (temp[w]) { map.removeLayer(temp[w]); temp[w] = null; } });
  setTap(null);
}
function cancelForm(){
  const e = editing; if (!e) return;
  e.addedPhotos.forEach(pid => photoDel(pid).catch(() => {}));   // photos added during a cancelled edit are thrown away
  const back = e.id;
  endForm(); renderMarkers();
  back ? showDetail(back) : closeSheet();
}
function saveForm(goNext){
  readForm();
  const e = editing;
  if (!e.address && !e.name && !okPt(e.box) && !okPt(e.house) && !e.photos.length) { toast('Add an address, name or location first'); return; }
  if (e.houseApprox && e.houseOrig && (!okPt(e.house) || e.house.lat !== e.houseOrig.lat || e.house.lng !== e.houseOrig.lng)) e.houseApprox = false;
  const rec = cleanStop(Object.assign({}, e, { id: e.id || e.newId }));
  const n = parseFloat(rec.seq);
  const moved = e.id && String(e.origSeq) !== rec.seq;
  const clash = isFinite(n) && stops.find(x => x.id !== rec.id && seqNum(x) === n);
  if (clash) {
    if (!e.insertMode && !confirm(`#${n} is already ${fullAddr(clash) || clash.name || 'another stop'}.\n\nOK = put this stop at #${n} and move later stops back one.\nCancel = go back and change the #.`)) return;
    insertAt(rec, n);
  }
  const i = stops.findIndex(x => x.id === rec.id);
  if (i >= 0) stops[i] = rec; else stops.push(rec);
  if (moved && clash) renumber();
  save();
  e.removedPhotos.forEach(pid => photoDel(pid).catch(() => {}));
  endForm();
  renderMarkers();
  toast('Saved');
  const nx = goNext ? neighbor(rec.id, 1) : null;
  if (nx) startForm(nx.id); else showDetail(rec.id);
}
async function addPhotos(files){
  if (!editing || !files.length) return;
  const stopId = editing.id || editing.newId;
  toast('Adding photo' + (files.length > 1 ? 's' : '') + '…', 8000);
  let added = 0;
  for (const f of files) {
    try {
      const { blob, w, h } = await resizeImage(f);
      const id = uid();
      await photoPut({ id, stopId, blob, w, h, created: Date.now() });
      if (!editing) { photoDel(id).catch(() => {}); return; }
      editing.photos.push(id); editing.addedPhotos.push(id); added++;
    } catch(err) { toast('Photo failed: ' + (err && err.message || err), 4000); }
  }
  askPersist();
  if (editing) { readForm(); showForm(); }
  if (added) toast(added + ' photo' + (added > 1 ? 's' : '') + ' added — tap Save to keep', 3000);
}
let photoTarget = { kind: 'stop' };
$('photoIn').addEventListener('change', ev => {
  const files = [...ev.target.files]; ev.target.value = '';
  const tgt = photoTarget; photoTarget = { kind: 'stop' };
  if (!files.length) return;
  if (tgt.kind === 'chk') addCheckPhotos(tgt.idx, files); else addPhotos(files);
});

function useGPS(what){
  if (!navigator.geolocation) { toast('Location not available on this device'); return; }
  toast('Getting GPS fix…', 8000);
  navigator.geolocation.getCurrentPosition(p => {
    setEditLoc(what, p.coords.latitude, p.coords.longitude);
    map.flyTo([p.coords.latitude, p.coords.longitude], 18, { duration: .6 });
    toast(`${WHAT[what]} placed (±${Math.round(p.coords.accuracy)} m). Drag to adjust if needed.`, 3500);
  }, err => toast('GPS failed: ' + err.message, 3500), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}
function samePrev(){
  readForm();
  const n = seqNum(editing);
  const prev = sorted(stops.filter(s => s.id !== editing.id && okPt(s.box) && seqNum(s) < n)).pop();
  if (!prev) { toast('No earlier stop has a mailbox placed'); return; }
  setEditLoc('box', prev.box.lat, prev.box.lng);
  map.flyTo([prev.box.lat, prev.box.lng], Math.max(map.getZoom(), 17), { duration: .6 });
  toast(`Copied mailbox from #${seqLabel(prev)} ${fullAddr(prev)}`, 3000);
}
async function geocode(){
  readForm();
  const addr = editing.address.replace(/\?/g, '').trim();
  if (!addr) { toast('Enter an address first'); return; }
  toast('Looking up…', 8000);
  const q = addr + (settings.area ? ', ' + settings.area : '');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j.length) { toast('No match found. Use GPS or tap the map.', 3500); return; }
    setEditLoc('house', parseFloat(j[0].lat), parseFloat(j[0].lon));
    map.flyTo([editing.house.lat, editing.house.lng], 17, { duration: .6 });
    toast('Approximate — rural lookups are often off. Check satellite view and drag to the house.', 5000);
  } catch(e) { toast('Lookup failed (offline?). Use GPS or tap the map.', 3500); }
}

function setTap(what){
  tapTarget = what;
  $('banner').style.display = what ? 'flex' : 'none';
  if (what) { $('bannerText').textContent = 'Tap the map to place the ' + (what === 'box' ? 'mailbox' : 'house'); $('sheet').classList.add('hidden'); }
  else if (sheetMode) $('sheet').classList.remove('hidden');
}
map.on('click', e => {
  if (labelMode) { addSpace(e.latlng); return; }
  if (!tapTarget || !editing) return;
  const w = tapTarget;
  setTap(null);
  setEditLoc(w, e.latlng.lat, e.latlng.lng);
});

/* ================= shared "you are here" dot ================= */
function updateUserDot(ll, acc){

    userAcc = L.circle(ll, { radius: acc, color: '#3b9cff', weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
    userDot = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#3b9cff', fillOpacity: 1, interactive: false }).addTo(map);
  } else { userDot.setLatLng(ll); userAcc.setLatLng(ll).setRadius(acc); }
}
function removeUserDot(){
  if (userDot) { map.removeLayer(userDot); map.removeLayer(userAcc); userDot = userAcc = null; }
}

/* ================= route guidance ================= */
const nav = { active: false, paused: false, pkg: null, legs: [], i: 0, watch: null, pos: null, hPos: null, heading: null, acc: null,
  follow: true, approachSaid: false, steps: [], route: null, lastFetch: 0, offCount: 0, fetching: false, needFetch: false, wake: null };

function navTargetPt(s){
  if (settings.navTo === 'house') return okPt(s.house) ? s.house : (okPt(s.box) ? s.box : null);
  return anyPt(s);
}
/* Stops in seq order; consecutive stops at the same spot (e.g. a cluster box) become one leg. */
function buildLegs(){
  const legs = [];
  sorted(stops).forEach(s => {
    const p = navTargetPt(s); if (!p) return;
    const last = legs[legs.length - 1];
    if (last && distM(last.pt, p) < 15) { last.stops.push(s); return; }
    legs.push({ pt: { lat: p.lat, lng: p.lng }, stops: [s] });
  });
  return legs;
}
function legSameGroup(leg){ return leg.stops.every(s => s.group && s.group === leg.stops[0].group); }
function legTitle(leg){
  const s = leg.stops[0], n = leg.stops.length;
  if (n === 1) return fullAddr(s) || s.name || 'Stop #' + seqLabel(s);
  return legSameGroup(leg) ? `${s.group} — ${n} boxes` : `${fullAddr(s)} + ${n - 1} more`;
}
function legSeqText(leg){
  const a = seqLabel(leg.stops[0]), b = seqLabel(leg.stops[leg.stops.length - 1]);
  return a === b ? '#' + a : `#${a}–${b}`;
}

/* --- speech --- */
function sayPair(p){ return p === '00' ? 'hundred' : p[0] === '0' ? 'oh ' + p[1] : p; }
/* "18760" -> "18 7 60" (eighteen seven sixty), "16451" -> "16 4 51", "1650" -> "16 50" */
function sayNum(d){
  d = String(d).replace(/\D/g, '');
  if (d.length === 5) return d.slice(0,2) + ' ' + (d[2] === '0' ? 'oh' : d[2]) + ' ' + sayPair(d.slice(3));
  if (d.length === 4) return d.slice(0,2) + ' ' + sayPair(d.slice(2));
  return d.split('').join(' ');
}
const ABBR = { Rd:'Road', Ln:'Lane', Dr:'Drive', Ct:'Court', Hwy:'Highway', St:'Street', Ave:'Avenue', Blvd:'Boulevard', Pl:'Place', Wy:'Way',
  N:'North', S:'South', E:'East', W:'West' };
function speakAddr(s){
  const a = String(s.address || '').replace(/\?/g, '');
  const m = a.match(/^\s*(\d+)(.*)$/);
  let num = '', rest = a;
  if (m) { num = sayNum(m[1]); rest = m[2]; }
  rest = rest.replace(/\b1\/2\b/, 'and a half').replace(/\b([A-Z][a-z]{0,3})\b\.?/g, w => ABBR[w.replace('.', '')] || w);
  return (num + ' ' + rest).replace(/\s+/g, ' ').trim() + (s.unit ? ', unit ' + s.unit.replace(/[()]/g, '') : '');
}
function legPkgStops(leg){ const t = todayPkgs(); return leg.stops.filter(s => t.includes(s.id)); }
function legSpeech(leg){
  const s = leg.stops[0], n = leg.stops.length;
  let t = n > 1 && legSameGroup(leg) ? `${s.group}, ${n} boxes` : speakAddr(s) + (n > 1 ? `, and ${n - 1} more` : '');
  if (settings.navNames && s.name && n === 1) t += ', ' + s.name;
  return t;
}
function pkgSuffix(leg){
  const pk = legPkgStops(leg), n = leg.stops.length;
  if (!pk.length) return '';
  return n > 1 ? `. Package for ${pk.map(x => x.unit ? 'unit ' + x.unit.replace(/[()]/g, '') : sayNum(houseNum(x).split(' ')[0])).join(', ')}` : '. With a package';
}
function say(text){
  if (!settings.navVoice || !('speechSynthesis' in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 1; speechSynthesis.speak(u); } catch(e){}
}
function relBearing(from, to){
  if (nav.heading == null) return null;
  return ((bearing(from, to) - nav.heading + 540) % 360) - 180;
}
function sideWord(from, to){
  const rel = relBearing(from, to);
  if (rel == null) return '';
  if (Math.abs(rel) < 15) return ', straight ahead';
  if (Math.abs(rel) > 165) return ', behind you';
  return rel > 0 ? ', on the right' : ', on the left';
}

/* --- street turns (optional; uses the free OSRM demo server, needs reception) --- */
function stepText(st){
  const m = st.maneuver || {}, mod = m.modifier || '', name = st.name ? ' onto ' + expandRoad(st.name) : '';
  switch (m.type) {
    case 'depart': case 'arrive': return '';
    case 'turn': case 'end of road':
      if (mod === 'uturn') return 'Make a U-turn' + name;
      if (mod === 'straight') return 'Continue straight' + name;
      return 'Turn ' + mod + name;
    case 'new name': case 'continue':
      if (mod === 'uturn') return 'Make a U-turn';
      return mod && mod !== 'straight' ? 'Keep ' + mod + name : (st.name ? 'Continue' + name : '');
    case 'fork': return 'Keep ' + (mod || 'straight') + ' at the fork' + name;
    case 'merge': return 'Merge' + (mod ? ' ' + mod : '') + name;
    case 'on ramp': return 'Take the ramp' + name;
    case 'off ramp': return 'Take the exit' + name;
    case 'roundabout': case 'rotary': return 'At the roundabout, take exit ' + (m.exit || 1) + name;
    default: return mod ? 'Go ' + mod + name : '';
  }
}
function expandRoad(n){ return String(n).replace(/\b([A-Z][a-z]{0,3})\b\.?/g, w => ABBR[w.replace('.', '')] || w); }
function stepArrow(st){
  const mod = (st.maneuver && st.maneuver.modifier) || '';
  return mod === 'uturn' ? '⤺' : /left/.test(mod) ? (/slight/.test(mod) ? '↖' : '↰') : /right/.test(mod) ? (/slight/.test(mod) ? '↗' : '↱') : '↑';
}
async function fetchTurns(){
  navLayer.clearLayers(); nav.steps = []; nav.route = null; nav.offCount = 0;
  const leg = nav.legs[nav.i];
  if (!settings.navTurns || !leg || !nav.pos || !navigator.onLine || nav.fetching) return;
  if (distM(nav.pos, leg.pt) < 150) return;   // close enough — no street directions needed
  nav.fetching = true; nav.lastFetch = Date.now();
  const myI = nav.i;
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${nav.pos.lng.toFixed(6)},${nav.pos.lat.toFixed(6)};${leg.pt.lng.toFixed(6)},${leg.pt.lat.toFixed(6)}?steps=true&overview=full&geometries=geojson`;
    const r = await fetch(url);
    const j = await r.json();
    if (myI !== nav.i || !nav.active) return;
    if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error('no route');
    const rt = j.routes[0];
    nav.route = rt.geometry.coordinates.map(c => ({ lat: c[1], lng: c[0] }));
    nav.steps = rt.legs[0].steps.map(st => ({ text: stepText(st), arrow: stepArrow(st),
      pt: { lat: st.maneuver.location[1], lng: st.maneuver.location[0] }, done: false, pre: false, said: false })).filter(s => s.text);
    L.polyline(nav.route.map(p => [p.lat, p.lng]), { color: '#3b9cff', weight: 6, opacity: .55, interactive: false }).addTo(navLayer);
  } catch(e) {
    toast('Street turns unavailable right now — still guiding stop to stop', 3000);
  } finally { nav.fetching = false; renderNav(); }
}
function updateTurns(cur){
  if (!nav.steps.length) return;
  const st = nav.steps.find(x => !x.done);
  if (st) {
    const d = distM(cur, st.pt);
    if (d < 25) st.done = true;
    else if (!st.pre && d < 400 && d > 150) { st.pre = true; say(`In ${fmtDist(d)}, ${st.text}`); }
    else if (!st.said && d <= 80) { st.said = true; st.pre = true; say(st.text); }
  }
  if (nav.route) {
    nav.offCount = distToPath(cur, nav.route) > 50 ? nav.offCount + 1 : 0;
    if (nav.offCount >= 3 && Date.now() - nav.lastFetch > 15000) fetchTurns();
  }
}

/* --- keep the screen awake while guiding --- */
async function wakeOn(){
  try { if ('wakeLock' in navigator && !nav.wake) { nav.wake = await navigator.wakeLock.request('screen'); nav.wake.addEventListener('release', () => { nav.wake = null; }); } } catch(e){ nav.wake = null; }
}
function wakeOff(){ try { if (nav.wake) nav.wake.release(); } catch(e){} nav.wake = null; }

function navWatchOn(){
  if (nav.watch != null) navigator.geolocation.clearWatch(nav.watch);
  nav.watch = navigator.geolocation.watchPosition(onNavFix, err => toast('GPS: ' + err.message, 3000),
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function navWatchOff(){ if (nav.watch != null) navigator.geolocation.clearWatch(nav.watch); nav.watch = null; }

function startNav(o){
  if (!navigator.geolocation) { toast('Location not available on this device'); return; }
  const legs = buildLegs();
  if (!legs.length) { toast('Place some mailbox or house pins first'); return; }
  let i = 0;
  if (o && o.id) {
    i = legs.findIndex(l => l.stops.some(s => s.id === o.id));
    if (i < 0) { const st = stops.find(x => x.id === o.id); const n = st ? seqNum(st) : 0; i = legs.findIndex(l => l.stops.some(s => seqNum(s) >= n)); }
  } else if (o && o.seq != null && isFinite(o.seq)) {
    i = legs.findIndex(l => l.stops.some(s => seqNum(s) >= o.seq));
  }
  if (i < 0) { toast('No placed stops at or after that #'); return; }
  if (editing) cancelForm();
  if (labelMode) setLabelMode(false);
  if (watchId != null) toggleLocate();
  closeSheet();
  Object.assign(nav, { legs, i, active: true, paused: false, follow: true, approachSaid: false, pos: null, hPos: null, heading: null,
    steps: [], route: null, needFetch: true });
  timerStart(o && o.resume);
  say('Starting route.');            // first speech must happen during the tap so iPhone allows it
  navWatchOn(); wakeOn();
  saveNavProgress(); announceLeg(); renderNav();
  const skipped = stops.length - legs.reduce((n, l) => n + l.stops.length, 0);
  if (skipped > 0) toast(`${skipped} stop${skipped > 1 ? 's' : ''} without a pin will be skipped`, 3500);
}
function saveNavProgress(){
  const leg = nav.legs[nav.i];
  settings.navPos = leg ? { id: leg.stops[0].id, seq: seqLabel(leg.stops[0]) } : null;
  saveSettings();
}
function announceLeg(){
  const leg = nav.legs[nav.i]; if (!leg) return;
  const d = nav.pos ? ', ' + fmtDist(distM(nav.pos, leg.pt)) : '';
  say(`Next, stop ${seqLabel(leg.stops[0])}, ${legSpeech(leg)}${d}${pkgSuffix(leg)}`);
}
function advance(dir, how){
  const ni = nav.i + dir;
  if (ni < 0) { toast('Already at the first stop'); return; }
  nav.i = ni; nav.approachSaid = false; nav.needFetch = true; navLayer.clearLayers(); nav.steps = []; nav.route = null;
  if (nav.i >= nav.legs.length) { finishNav(); return; }
  saveNavProgress();
  if (how !== 'quiet') announceLeg();
  if (nav.pos) { nav.needFetch = false; fetchTurns(); }
  renderNav();
}
function arrive(){
  const leg = nav.legs[nav.i];
  timerArrive(nav.i, leg);
  renderMarkers();                    // grey out what's done
  say('Arrived, ' + (leg.stops.length > 1 && legSameGroup(leg) ? leg.stops[0].group : sayNum(houseNum(leg.stops[0]).split(' ')[0]) || 'stop')
    + (legPkgStops(leg).length ? '. Package here.' : ''));
  advance(1);
}
function onNavFix(p){
  if (!nav.active || nav.paused) return;
  const cur = { lat: p.coords.latitude, lng: p.coords.longitude };
  nav.acc = p.coords.accuracy;
  if (p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > 1.5) nav.heading = p.coords.heading;
  else if (nav.hPos && distM(nav.hPos, cur) > 6) nav.heading = bearing(nav.hPos, cur);
  if (!nav.hPos || distM(nav.hPos, cur) > 6) nav.hPos = cur;
  nav.pos = cur;
  updateUserDot([cur.lat, cur.lng], p.coords.accuracy);
  if (nav.follow) map.setView([cur.lat, cur.lng], Math.max(map.getZoom(), 17), { animate: true });

  if (nav.pkg) { renderNav(); return; }    // walking a package — don't auto-advance or count it as driving away
  timerDepartCheck(cur);
  const leg = nav.legs[nav.i];
  if (!leg) { finishNav(); return; }
  const R = (settings.arriveFt || 80) / 3.28084;
  const d = distM(cur, leg.pt);
  const next = nav.legs[nav.i + 1];
  if (d <= R) { arrive(); return; }
  if (next && distM(cur, next.pt) <= R) {          // passed this one without getting close — move on
    timerSkip(nav.i, leg);
    nav.i++; arrive(); return;
  }
  if (!nav.approachSaid && d <= 160) { nav.approachSaid = true; say(`In ${fmtDist(d)}, ${legSpeech(leg)}${sideWord(cur, leg.pt)}${pkgSuffix(leg)}`); }
  if (nav.needFetch) { nav.needFetch = false; fetchTurns(); }
  updateTurns(cur);
  renderNav();
}
function pauseNav(){
  nav.paused = true; navWatchOff(); wakeOff();
  try { speechSynthesis.cancel(); } catch(e){}
  timerPause();
  renderNav();
}
function resumeNav(){
  nav.paused = false; nav.follow = true; nav.approachSaid = false; nav.needFetch = true;
  timerResume();
  say('Resuming.'); navWatchOn(); wakeOn(); announceLeg(); renderNav();
}
/* --- package deliveries: press 📦 when you leave the vehicle with a package, press again when you're back --- */
function pkgToggle(){
  if (!run) return;
  if (nav.pkg) {
    const d = run.drops[nav.pkg.di];
    const to = Date.now();
    if (d) { d.pkg = (d.pkg || []).concat({ from: nav.pkg.from, to, id: nav.pkg.id }); d.depart = null; }
    const ms = activeMs(nav.pkg.from, to);
    if (nav.pkg.id && hasPkgToday(nav.pkg.id)) setTodayPkgs(todayPkgs().filter(x => x !== nav.pkg.id));   // delivered — off today's list
    nav.pkg = null; saveRuns(); renderMarkers();
    say('Package done, ' + sayDur(ms));
  } else {
    const di = run.drops.length - 1;
    if (di < 0) { toast('Reach your first stop before starting a package'); return; }
    const d = run.drops[di];
    let pid = d.ids[0];
    if (d.ids.length > 1) {          // cluster box: ask which unit so the package counts for the right address
      const ans = prompt(`Which unit or space is the package for? (e.g. ${stops.find(x => x.id === d.ids[1]) ? stops.find(x => x.id === d.ids[1]).unit || 'RV12' : 'RV12'})\nLeave blank if not sure.`, '');
      if (ans === null) return;
      const a = ans.trim().toLowerCase().replace(/[#\s]/g, '');
      const m = a && d.ids.map(id => stops.find(x => x.id === id)).find(x => x && x.unit.toLowerCase().replace(/[#\s()]/g, '') === a.replace(/[()]/g, ''));
      if (m) pid = m.id; else if (a) toast('No unit "' + ans.trim() + '" in this cluster — counted for the first box', 3000);
    }
    nav.pkg = { from: Date.now(), di, id: pid };
    say('Package delivery, stop ' + d.seq);
  }
  renderNav();
}
function sayDur(ms){
  const s = Math.round(ms / 1000), m = Math.floor(s / 60), sec = s % 60;
  return (m ? m + (m === 1 ? ' minute ' : ' minutes ') : '') + sec + ' seconds';
}
function pkgMs(d, r){ return (d.pkg || []).reduce((t, p) => t + activeMs(p.from, p.to, r), 0); }

function endNav(){
  if (nav.pkg) pkgToggle();
  navWatchOff(); wakeOff(); try { speechSynthesis.cancel(); } catch(e){}
  if (!nav.paused) timerPause();
  nav.active = false; nav.paused = false; navLayer.clearLayers(); removeUserDot();
  $('navbar').style.display = 'none';
  if (settings.navPos) toast(`Stopped at #${settings.navPos.seq}. Resume from the ⋯ menu.`, 4000);
}
function finishNav(){
  if (nav.pkg) pkgToggle();
  timerFinish();
  renderMarkers();
  say('Route complete. Nice work.');
  settings.navPos = null; saveSettings();
  navWatchOff(); wakeOff(); nav.active = false; navLayer.clearLayers(); removeUserDot();
  $('navbar').style.display = 'none';
  showTimes(runs.length - 1);
}
const ARROW_SVG = '<svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 2 L20 21 L12 16.5 L4 21 Z" fill="#3b9cff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function renderNav(){
  const el = $('navbar');
  if (!nav.active) { el.style.display = 'none'; return; }

  if (!leg) { el.style.display = 'none'; return; }
  const s = leg.stops[0];
  let dist = '', rot = 0, dirTxt = '';

    const d = distM(nav.pos, leg.pt);
    dist = fmtDistShort(d);
    const rel = relBearing(nav.pos, leg.pt);

  }

  const sub = [legSeqText(leg), leg.stops.length === 1 && s.name ? s.name : '', settings.navTo === 'house' && okPt(s.house) ? 'House' : (okPt(s.box) ? 'Mailbox' : 'House')].filter(Boolean).join(' · ');

    <div class="nv-main">
      <div class="nv-arrow"><svg width="30" height="30" viewBox="0 0 24 24" style="transform:rotate(${Math.round(rot)}deg)"><path d="M12 2 L20 21 L12 16.5 L4 21 Z" fill="#3b9cff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
      <div class="nv-txt"><div class="nv-addr">${esc(legTitle(leg))}</div><div class="nv-sub">${esc(sub)}</div></div>

    ${turn}
    ${(() => {
      if (nav.pkg) return '';

      if (here.length) return `<div class="nv-pk">📦 PACKAGE HERE (#${esc(ld.seq)}): ${here.map(x => esc(ld.ids.length > 1 && x.unit ? x.unit : fullAddr(x))).join(', ')} — tap 📦 to time it</div>`;

    ${nav.paused ? '<div class="nv-paused">Paused — your place is saved</div>' : ''}
    <div class="nv-btns">

      <button data-nv="maps" aria-label="Apple Maps directions">🗺</button>

$('navbar').addEventListener('click', ev => {

/* ================= timing — each drop, each section, whole route ================= */
/* A run = one trip through the route (continued if you resume within 14 hours).
   For each stop reached: arrive time, and depart time (when you drive away). Paused time is not counted. */
let run = null;
function timerStart(resume){
  const last = runs[runs.length - 1];
  const now = Date.now();
  if (resume && last && !last.done && now - last.start < 14 * 3600 * 1000) {
    run = last;
    const op = run.pauses.find(p => !p.to); if (op) op.to = now;
  } else {
    run = { id: uid(), start: now, end: null, done: false, pauses: [], drops: [] };
    runs.push(run);
  }
  saveRuns();
  renderMarkers();
}
function activeMs(a, b, r){
  r = r || run;
  let t = b - a;
  (r ? r.pauses : []).forEach(p => { const to = p.to || Date.now(); const o = Math.min(b, to) - Math.max(a, p.from); if (o > 0) t -= o; });
  return Math.max(0, t);
}
function timerArrive(i, leg){
  if (!run) return;
  const now = Date.now();
  const prev = run.drops[run.drops.length - 1];
  if (prev && !prev.depart) prev.depart = now;
  run.drops.push({ ids: leg.stops.map(s => s.id), seq: seqLabel(leg.stops[0]), seqEnd: seqLabel(leg.stops[leg.stops.length - 1]),
    title: legTitle(leg), group: leg.stops[0].group || '', n: leg.stops.length, lat: leg.pt.lat, lng: leg.pt.lng, arrive: now, depart: null });
  run.end = now; saveRuns();
}
function timerSkip(i, leg){
  if (!run) return;
  const prev = run.drops[run.drops.length - 1];
  if (prev && !prev.depart) prev.depart = Date.now();
}
function timerDepartCheck(cur){
  if (!run) return;
  const d = run.drops[run.drops.length - 1];

function timerPause(){ if (run && !run.pauses.some(p => !p.to)) { run.pauses.push({ from: Date.now(), to: null }); run.end = Date.now(); saveRuns(); } }

  if (prev && !prev.depart) prev.depart = now;
  const op = run.pauses.find(p => !p.to); if (op) op.to = now;

function fmtDur(ms){

function showTimes(idx){

  }
  const r = idx != null && runs[idx] && runs[idx].drops.length ? runs[idx] : valid[valid.length - 1];

  const others = valid.filter(x => x !== r);
  const prev = valid[ri - 1] || null;
  const date = new Date(r.start).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const total = runTotal(r);

  html += `<div class="locbox"><div class="stat">${esc(date)} · ${r.drops.length} drops${r.done ? '' : ' · not finished'}</div>
    <div class="big">${fmtDur(total)}</div>
    <div class="stat">${prev ? 'vs previous run: ' + (fmtDelta(total - prevTotal) || 'same') : 'First timed run'}${isFinite(bestTotal) ? ' · best finished: ' + fmtDur(bestTotal) : ''}</div>
    ${(() => { const np = r.drops.reduce((n, d) => n + (d.pkg || []).length, 0); const pm = r.drops.reduce((t, d) => t + pkgMs(d, r), 0);
      return np ? `<div class="stat">📦 ${np} package${np > 1 ? 's' : ''} · ${fmtDur(pm)} total · ${fmtDur(pm / np)} each on average · route without packages: ${fmtDur(total - pm)}</div>` : '<div class="stat">📦 No packages logged — tap 📦 during guidance when you walk one up.</div>'; })()}

  // sections
  const secs = sectionTimes(r);
  const hist = {};
  others.forEach(x => sectionTimes(x).forEach(s => { (hist[s.group] = hist[s.group] || []).push(s.ms); }));
  const prevSecs = prev ? Object.fromEntries(sectionTimes(prev).map(s => [s.group, s.ms])) : {};
  html += `<h3 style="margin:16px 0 0;font-size:16px">Sections</h3><table class="tt"><tr><th>Section</th><th class="r">Time</th><th class="r">vs last</th><th class="r">Best</th></tr>`;
  secs.forEach(s => {
    const h = hist[s.group] || [];
    const best = h.length ? Math.min(...h) : null;
    html += `<tr><td>${esc(s.group)}<div class="stat" style="font-size:12px">${s.drops} drop${s.drops > 1 ? 's' : ''}${s.pkgN ? ` · 📦 ${s.pkgN} (${fmtDur(s.pkgMs)})` : ''}</div></td><td class="r">${fmtDur(s.ms)}</td><td class="r">${prevSecs[s.group] != null ? fmtDelta(s.ms - prevSecs[s.group]) : ''}</td><td class="r">${best != null ? fmtDur(Math.min(best, s.ms)) : ''}</td></tr>`;
  });
  html += `</table>`;
  // drops
  const dropHist = {};
  others.forEach(x => x.drops.forEach(d => { const w = dwell(d, x); if (w != null) (dropHist[d.ids[0]] = dropHist[d.ids[0]] || []).push(w); }));
  const dw = r.drops.map(d => ({ d, w: dwell(d, r) })).filter(x => x.w != null);
  const avg = dw.length ? dw.reduce((a, x) => a + x.w, 0) / dw.length : null;
  html += `<h3 style="margin:16px 0 0;font-size:16px">Drops</h3><div class="stat">Time stopped at each drop (arrive → drive away). Average: ${fmtDur(avg)}</div>`;
  const slow = dw.slice().sort((a, b) => b.w - a.w).slice(0, 15);

  });

    <div class="row"><button class="b" data-act="expruns">Export times (CSV)</button></div>
    <div class="row"><button class="b danger" data-act="delrun" data-run="${runs.indexOf(r)}">Delete this run</button></div>`;
  openSheet('times', html);
}

/* 1) Quick place: drive the route once, one tap per mailbox. */
const quick = { on: false, id: null, lastBox: null };
function nextUnplaced(afterId, what){
  const list = sorted(stops);
  let i = afterId ? list.findIndex(s => s.id === afterId) + 1 : 0;
  for (; i < list.length; i++) if (!okPt(list[i][what])) return list[i];
  return null;
}
function startQuick(fromId){
  const s = fromId ? stops.find(x => x.id === fromId) : nextUnplaced(null, 'box');
  if (!s) { toast('Every stop already has a mailbox pin'); return; }
  if (nav.active) endNav();
  if (editing) cancelForm();
  closeSheet();
  quick.on = true; quick.id = s.id;
  if (watchId == null) toggleLocate();
  renderQuick();
}
function renderQuick(){
  const el = $('navbar');
  if (!quick.on) { el.style.display = 'none'; return; }
  const s = stops.find(x => x.id === quick.id);
  if (!s) { stopQuick(); return; }
  const left = stops.filter(x => !okPt(x.box)).length;
  el.innerHTML = `
    <div class="nv-top"><span>📍 Quick place · ${left} mailboxes left</span><span>${esc(s.group || '')}</span></div>
    <div class="nv-main"><div class="nv-txt"><div class="nv-addr">#${esc(seqLabel(s))} ${esc(fullAddr(s)) || '<i>no address</i>'}</div>
      <div class="nv-sub">${esc(s.name || '')}${okPt(s.box) ? ' · mailbox ✓' : ''}${okPt(s.house) ? ' · house ✓' : ''}</div></div></div>
    <div class="nv-btns">

      <button data-q="house">🏠 House here</button>
    </div>

      <button data-q="same" ${quick.lastBox ? '' : 'disabled'}>＝ Same box</button>
      <button data-q="prev">◀</button>

function quickNext(){
  const n = nextUnplaced(quick.id, 'box');
  if (!n) { toast('That was the last stop without a mailbox pin'); stopQuick(); return; }
  quick.id = n.id; renderQuick();
}
function quickSet(what, pt){
  const s = stops.find(x => x.id === quick.id); if (!s) return;
  s[what] = { lat: pt.lat, lng: pt.lng };
  if (what === 'house') s.houseApprox = false;
  let extra = 0;
  if (what === 'box') {
    quick.lastBox = { lat: pt.lat, lng: pt.lng };
    if (normType(s.type) === 'cbu' && s.group) {   // cluster box: every following stop in the same section shares it
      const list = sorted(stops); let i = list.indexOf(s) + 1;
      while (i < list.length && list[i].group === s.group && normType(list[i].type) === 'cbu') {
        if (!okPt(list[i].box)) { list[i].box = { lat: pt.lat, lng: pt.lng }; extra++; }
        quick.id = list[i].id; i++;
      }
    }
  }
  save(); renderMarkers();
  settings.lastId = s.id; saveSettings();
  toast(`${what === 'box' ? 'Mailbox' : 'House'} placed for #${seqLabel(s)}${extra ? ` + ${extra} more boxes in ${s.group}` : ''}`, 2200);
  if (what === 'box') quickNext(); else renderQuick();
}

    quickSet(what, { lat: p.coords.latitude, lng: p.coords.longitude });
  }, err => toast('GPS failed: ' + err.message, 3500), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });

/* 2) Auto-place houses from OpenStreetMap address data (approximate; only exact house-number matches). */
const auto = { running: false, cancel: false };
async function autoPlaceHouses(){
  if (auto.running) return;
  if (!navigator.onLine) { toast('Needs reception'); return; }
  const todo = sorted(stops).filter(s => !okPt(s.house) && /^\s*\d+/.test(s.address) && !/\?/.test(s.address));
  if (!todo.length) { toast('No unplaced houses with a usable address'); return; }
  if (!confirm(`Look up ${todo.length} addresses on OpenStreetMap?\n\nTakes about ${Math.ceil(todo.length * 1.1 / 60)} minute(s) — the free service allows 1 lookup per second. Keep the app open with reception.\n\nOnly exact house-number matches are placed, and they're marked "approximate" for you to check. Many rural addresses won't be found.`)) return;
  const [city, state] = String(settings.area || '').split(',').map(x => x.trim());
  auto.running = true; auto.cancel = false;
  $('bannerText').textContent = 'Looking up houses… 0/' + todo.length;
  $('banner').style.display = 'flex'; $('bannerCancel').textContent = 'Stop';
  let found = 0, done = 0;
  for (const s of todo) {
    if (auto.cancel) break;
    const num = s.address.match(/^\s*(\d+)/)[1];
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=3&countrycodes=us'
        + '&street=' + encodeURIComponent(s.address) + (city ? '&city=' + encodeURIComponent(city) : '') + (state ? '&state=' + encodeURIComponent(state) : '');
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (r.status === 429) { toast('The lookup service asked us to slow down — stopping. Try again later.', 5000); break; }
      const j = r.ok ? await r.json() : [];
      const hit = j.find(x => x.address && String(x.address.house_number || '').split(/[;,\s]/)[0] === num);
      if (hit) { s.house = { lat: parseFloat(hit.lat), lng: parseFloat(hit.lon) }; s.houseApprox = true; found++; }
    } catch(e) {}
    done++;
    $('bannerText').textContent = `Looking up houses… ${done}/${todo.length} · ${found} found`;
    if (done % 10 === 0) { save(); renderMarkers(); }
    await new Promise(res => setTimeout(res, 1100));
  }
  save(); renderMarkers();
  auto.running = false;
  $('banner').style.display = 'none'; $('bannerCancel').textContent = 'Cancel';
  toast(`Placed ${found} of ${done} houses. They're marked approximate — check each on satellite view.`, 6000);
}

async function deliver(name, text, mime){
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch(e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function csvCell(v){ v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
const COLS = ['seq','group','address','unit','name','type','notes','box_lat','box_lng','house_lat','house_lng','biz_name','biz_days','biz_open','biz_close','biz_note'];
function toCSV(){
  const rows = [COLS];
  sorted(stops).forEach(s => rows.push([s.seq, s.group, s.address, s.unit, s.name, s.type, s.notes,
    okPt(s.box) ? s.box.lat : '', okPt(s.box) ? s.box.lng : '', okPt(s.house) ? s.house.lat : '', okPt(s.house) ? s.house.lng : '',
    s.biz ? s.biz.name : '', s.biz ? s.biz.days.map(d => DAYS[d]).join(' ') : '', s.biz ? s.biz.open : '', s.biz ? s.biz.close : '', s.biz ? s.biz.note : '']));
  return rows.map(r => r.map(csvCell).join(',')).join('\n');
}
function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function fromCSV(text){
  const rows = parseCSV(text.replace(/^﻿/, ''));
  if (rows.length < 2) throw new Error('No data rows');
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = names => h.findIndex(x => names.includes(x));
  const ci = {
    seq: col(['seq','seq #','seq#','sequence','order','#']),
    group: col(['group','section','street']),
    address: col(['address','addr','physical address','delivery address']),
    unit: col(['unit','apt','space','box #','box#']),
    name: col(['name','names','customer']),
    type: col(['type','box type','mailbox type']),
    notes: col(['notes','note','comments']),
    box_lat: col(['box_lat','lat','latitude']), box_lng: col(['box_lng','lng','lon','long','longitude']),
    house_lat: col(['house_lat']), house_lng: col(['house_lng','house_lon']),
    biz_name: col(['biz_name','business','business name']), biz_days: col(['biz_days','days']),
    biz_open: col(['biz_open','open','opens']), biz_close: col(['biz_close','close','closes']), biz_note: col(['biz_note','hours note','hours'])
  };
  if (ci.address < 0 && ci.name < 0 && ci.box_lat < 0 && ci.house_lat < 0) throw new Error('Need an "address" column (or name / location columns)');
  const g = (r, i) => i >= 0 && r[i] != null ? r[i].trim() : '';
  return rows.slice(1).map(r => cleanStop({ seq: g(r, ci.seq), group: g(r, ci.group), address: g(r, ci.address), unit: g(r, ci.unit),
    name: g(r, ci.name), type: g(r, ci.type), notes: g(r, ci.notes),
    box_lat: g(r, ci.box_lat), box_lng: g(r, ci.box_lng), house_lat: g(r, ci.house_lat), house_lng: g(r, ci.house_lng),
    biz_name: g(r, ci.biz_name), biz_days: g(r, ci.biz_days), biz_open: g(r, ci.biz_open), biz_close: g(r, ci.biz_close), biz_note: g(r, ci.biz_note) }));
}
async function backupJSON(withPhotos){
  const out = { version: 4, exported: new Date().toISOString(), stops, spaces, runs, checks };
  if (withPhotos) {
    toast('Preparing backup with photos…', 15000);
    try {
      const all = await photoAll();
      const live = new Set([...stops.flatMap(s => s.photos), ...allCheckPhotoIds()]);
      out.photos = [];
      for (const p of all) if (live.has(p.id)) out.photos.push({ id: p.id, stopId: p.stopId, w: p.w, h: p.h, created: p.created, data: await blobToDataURL(p.blob) });
    } catch(e) { toast('Could not read photos: ' + e.message, 4000); return; }
  }
  deliver(`route-backup-${withPhotos ? 'photos-' : ''}${stamp()}.json`, JSON.stringify(out), 'application/json');
}
async function cleanupOrphanPhotos(){
  try {
    const live = new Set([...stops.flatMap(s => s.photos), ...allCheckPhotoIds()]);
    const all = await photoAll();
    for (const p of all) if (!live.has(p.id)) await photoDel(p.id);
  } catch(e){}
}
$('fileIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const text = await f.text();
    let incoming, j = null;
    if (/\.json$/i.test(f.name) || /^\s*[\[{]/.test(text)) {
      j = JSON.parse(text);
      const arr = Array.isArray(j) ? j : j.stops;
      if (!Array.isArray(arr)) throw new Error('Expected a list of stops');
      incoming = arr.map(cleanStop);
    } else incoming = fromCSV(text);
    if (!incoming.length) { toast('Nothing to import'); return; }
    const replace = stops.length && confirm(`Import ${incoming.length} stops.\n\nOK = REPLACE the ${stops.length} existing stops\nCancel = ADD to existing`);
    if (replace) stops = incoming;
    else {
      const ids = new Set(stops.map(s => s.id));
      incoming.forEach(s => { if (ids.has(s.id)) s.id = uid(); });
      stops = stops.concat(incoming);
    }
    if (j && !Array.isArray(j)) {
      if (Array.isArray(j.spaces)) { const sp = j.spaces.map(cleanSpace).filter(Boolean); spaces = replace ? sp : spaces.concat(sp); saveSpaces(); }
      if (Array.isArray(j.runs) && replace) { runs = j.runs; saveRuns(); }
      if (j.checks && replace && Array.isArray(j.checks.history)) { checks = Object.assign({ template: DEFAULT_CHECK.slice(), draft: null, history: [] }, j.checks); saveChecks(); }
      if (Array.isArray(j.photos) && j.photos.length) {
        toast('Restoring photos…', 15000);
        if (replace) await photoClear();
        for (const p of j.photos) { try { await photoPut({ id: p.id, stopId: p.stopId, w: p.w, h: p.h, created: p.created, blob: await dataURLToBlob(p.data) }); } catch(e){} }
        askPersist();
      }
    }
    save(); renderMarkers(); renderSpaces();
    if (replace) cleanupOrphanPhotos();
    toast(`Imported ${incoming.length} stops`);
    showData();
  } catch(e) { toast('Import failed: ' + e.message, 4000); }
});

/* ================= my location (◎ button) ================= */
function toggleLocate(){
  const btn = $('btnLocate');
  if (nav.active) { nav.follow = true; if (nav.pos) map.setView([nav.pos.lat, nav.pos.lng], Math.max(map.getZoom(), 17)); renderNav(); return; }
  if (watchId != null) {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    removeUserDot();
    btn.classList.remove('on');
    return;
  }
  if (!navigator.geolocation) { toast('Location not available'); return; }
  btn.classList.add('on'); firstFix = true;
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    updateUserDot(ll, p.coords.accuracy);
    if (firstFix) { map.flyTo(ll, 17, { duration: .6 }); firstFix = false; }
  }, err => { toast('Location error: ' + err.message, 3500); toggleLocate(); },
  { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

$('sheet').addEventListener('click', ev => {

  if (!b && item && item.dataset.ckh != null) { showCheckView(+item.dataset.ckh); return; }
  if (!b && item) { showDetail(item.dataset.id); return; }
  if (!b) return;
  const id = b.dataset.id, what = b.dataset.what;

    case 'close': closeSheet(); break;

    case 'edit': startForm(id); break;

    case 'prev': case 'next': { const n = neighbor(id, b.dataset.act === 'next' ? 1 : -1); if (n) showDetail(n.id); else toast('End of route'); break; }
    case 'go': if (s && okPt(s[what])) map.flyTo([s[what].lat, s[what].lng], 18, { duration: .6 }); break;
    case 'nav': if (s && okPt(s[what])) window.location.href = `https://maps.apple.com/?daddr=${s[what].lat},${s[what].lng}&dirflg=d`; break;
    case 'gnav': if (s && okPt(s[what])) window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${s[what].lat},${s[what].lng}&travelmode=driving`; break;
    case 'groupbox': {
      const others = stops.filter(x => x.id !== s.id && x.group === s.group && !okPt(x.box));
      if (!confirm(`Put the mailbox for ${others.length} stop${others.length === 1 ? '' : 's'} in "${s.group}" at this stop's mailbox location?\n\n(Stops that already have a mailbox placed are left alone.)`)) break;
      others.forEach(x => { x.box = { lat: s.box.lat, lng: s.box.lng }; });
      save(); renderMarkers(); toast(`Set ${others.length} mailboxes`); showDetail(s.id); break;
    }
    case 'gps': readForm(); useGPS(what); break;
    case 'tap': readForm(); setTap(what); break;
    case 'sameprev': samePrev(); break;
    case 'geo': geocode(); break;
    case 'clearloc': readForm(); editing[what] = null; updateTemps(); showForm(); break;
    case 'addphoto': readForm(); photoTarget = { kind: 'stop' }; $('photoIn').click(); break;
    case 'delphoto': {
      if (!editing || !confirm('Remove this photo?')) break;
      const pid = b.dataset.pid;
      readForm();
      editing.photos = editing.photos.filter(x => x !== pid);
      if (editing.addedPhotos.includes(pid)) { editing.addedPhotos = editing.addedPhotos.filter(x => x !== pid); photoDel(pid).catch(() => {}); }
      else editing.removedPhotos.push(pid);
      showForm(); break;
    }
    case 'save': saveForm(false); break;
    case 'savenext': saveForm(true); break;
    case 'cancel': cancelForm(); break;
    case 'del': {
      if (!confirm('Delete this stop?')) break;
      const did = editing.id;
      [...editing.photos, ...editing.removedPhotos].forEach(pid => photoDel(pid).catch(() => {}));
      stops = stops.filter(x => x.id !== did); save();
      photoDelFor(did).catch(() => {});
      endForm(); renderMarkers(); toast('Deleted'); showList(); break;
    }
    case 'navstart': { const v = parseFloat(($('s-navstart') || {}).value); startNav({ seq: isFinite(v) ? v : 1 }); break; }
    case 'navresume': if (settings.navPos) startNav({ id: settings.navPos.id, resume: true }); break;

    case 'pkrm': ev.stopPropagation(); setTodayPkgs(todayPkgs().filter(x => x !== id)); renderMarkers(); showPkgToday(); break;
    case 'pkclear': if (confirm('Clear today\'s package list?')) { setTodayPkgs([]); pkgResults = []; renderMarkers(); showPkgToday(); } break;

    case 'wipe':
      if (stops.length && confirm(`Delete all ${stops.length} stops and their photos?`) && confirm('Are you sure? This cannot be undone unless you have a backup.')) {
        stops = []; save(); photoClear().catch(() => {}); renderMarkers(); showData(); toast('All stops deleted');
      }
      break;
  }
});
$('sheet').addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 's-line') { settings.showLine = t.checked; saveSettings(); renderLine(); }
  if (t.id === 's-labels') { settings.labels = t.value; saveSettings(); renderMarkers(); }
  if (t.id === 's-navto') { settings.navTo = t.value; saveSettings(); }
  if (t.id === 's-arrive') { settings.arriveFt = +t.value; saveSettings(); }
  if (t.id === 's-voice') { settings.navVoice = t.checked; saveSettings(); }
  if (t.id === 's-names') { settings.navNames = t.checked; saveSettings(); }
  if (t.id === 's-turns') { settings.navTurns = t.checked; saveSettings(); }
  if (t.id === 't-run') showTimes(+t.value);
  if (t.id === 'f-type' && editing) { readForm(); updateTemps(); }
  if (t.id === 'f-isbiz') $('bizfields').style.display = t.checked ? 'block' : 'none';
  if (t.dataset && t.dataset.day != null) t.parentNode.classList.toggle('on', t.checked);
});
let ckSaveT;
$('sheet').addEventListener('input', ev => {
  const t = ev.target;
  if (checks.draft && (t.id === 'ck-veh' || t.id === 'ck-odo' || t.id === 'ck-notes' || t.dataset.cknote != null)) {
    if (t.id === 'ck-veh') checks.draft.vehicle = t.value.trim();
    else if (t.id === 'ck-odo') checks.draft.odometer = t.value.trim();
    else if (t.id === 'ck-notes') checks.draft.notes = t.value;
    else { const it = checks.draft.items[+t.dataset.cknote]; if (it) it.note = t.value; }
    clearTimeout(ckSaveT); ckSaveT = setTimeout(saveChecks, 400);
  }
  if (ev.target.id === 's-area') { settings.area = ev.target.value; saveSettings(); }
  if (ev.target.id === 'f-seq' && editing) { readForm(); updateTemps(); }
});

let qT;
$('q').addEventListener('input', () => {
  clearTimeout(qT);
  qT = setTimeout(() => { if (editing) return; listCap = 300; showList(); }, 200);
});
$('q').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  ev.preventDefault(); $('q').blur();
  if (editing) return;
  const q = $('q').value.trim();
  const hits = sorted(stops.filter(s => matches(s, q)));
  if (hits.length === 1) showDetail(hits[0].id);
  else {
    const pts = hits.map(anyPt).filter(Boolean).map(p => [p.lat, p.lng]);
    if (pts.length > 1) map.fitBounds(pts, { padding: [50,50], maxZoom: 17 });
  }
});
$('btnPkg').addEventListener('click', () => { if (editing) { toast('Finish or cancel the edit first'); return; } sheetMode === 'pkg' ? closeSheet() : (pkgResults = [], showPkgToday()); });
$('btnList').addEventListener('click', () => { if (editing) { toast('Finish or cancel the edit first'); return; } sheetMode === 'list' ? closeSheet() : showList(); });
$('btnAdd').addEventListener('click', () => { if (editing) return; if (labelMode) setLabelMode(false); startForm(null); });
$('btnLocate').addEventListener('click', toggleLocate);
$('btnData').addEventListener('click', () => { if (editing) { toast('Finish or cancel the edit first'); return; } sheetMode === 'data' ? closeSheet() : showData(); });
$('bannerCancel').addEventListener('click', () => { if (auto.running) { auto.cancel = true; return; } setTap(null); });

/* ================= offline support ================= */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('offline', () => toast('No reception — stops, GPS and voice guidance still work. Street turns and unseen map areas won\'t.', 5000));
window.addEventListener('online', () => toast('Back online'));

/* ================= init ================= */
load();
loadChecks();
renderMarkers();
renderSpaces();
zoomClass();
if (stops.some(anyPt)) fitAll();
})();
</script>
</body>
</html>
